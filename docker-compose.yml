services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elegance_ems
      POSTGRES_USER: elegance
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elegance -d elegance_ems"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://elegance:dev_password@postgres:5432/elegance_ems
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_elegance_2024}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:8081
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: ""

volumes:
  pgdata:
